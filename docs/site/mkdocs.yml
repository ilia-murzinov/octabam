site_name: ilia · octabam
site_url: https://ilia-murzinov.github.io/octabam/
repo_url: https://github.com/ilia-murzinov/octabam
repo_name: ilia-murzinov/octabam
docs_dir: .
site_dir: ../../out/site
use_directory_urls: false
exclude_docs: |
  reference/_remix-*.md
  reference/_credits-shipped.md
  reference/modules.md
  usage/*.md
  manual/*.md
extra_css:
  - css/fonts.css
  - css/sidebar-spacing.css
  - css/site-tables.css
  - css/builder.css
  - css/manual.css
  - css/chassis.css
theme:
  name: shadcn
  show_title: true
  show_stargazers: false
  accent: zinc
  icon: img/mark-icon.svg
  favicon: img/favicon.png
  pygments_style:
    light: shadcn-light
    dark: github-dark
nav:
  # This site has one job: build a personal image, then read the fork
  # modules that image carries. Grouped by what they are on the unit.
  - Home: index.md
  - Build: web-builder.md
  - Effects:
      - Resonator: reference/modules/resonator.md
      - SHATTER: reference/modules/shatter.md
      - Stuttr: reference/modules/stuttr.md
      - Void: reference/modules/void.md
  - Machines:
      - Complex Oscillator: reference/modules/cxosc.md
  - Tools:
      - Copy Project: reference/modules/copy-project.md
      - SEQ: reference/modules/seq.md
      - Persistent Buffers: reference/modules/persistent-buffers.md
      - Random Naming: reference/modules/rnd-name.md
      - Scope: reference/modules/scope.md
markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.snippets:
      base_path: [docs/site]
