site_name: ilia · octabam
site_url: https://ilia-murzinov.github.io/octabam/
repo_url: https://github.com/ilia-murzinov/octabam
repo_name: ilia-murzinov/octabam
docs_dir: .
site_dir: ../../out/site
use_directory_urls: false
exclude_docs: |
  reference/_remix-*.md
  reference/_credits-shipped.md
  usage/*.md
  manual/*.md
extra_css:
  - css/fonts.css
  - css/sidebar-spacing.css
  - css/site-tables.css
  - css/builder.css
  - css/manual.css
  - css/chassis.css
theme:
  name: shadcn
  show_title: true
  show_stargazers: false
  accent: orange
  icon: img/mark-icon.svg
  favicon: img/favicon.png
  pygments_style:
    light: shadcn-light
    dark: github-dark
nav:
  - Home: index.md
  - Build: web-builder.md
  - Modules:
      - VOID: reference/modules/void.md
      - RESONATOR: reference/modules/resonator.md
      - SHATTER: reference/modules/shatter.md
      - STUTTR: reference/modules/stuttr.md
      - CX OSC: reference/modules/cxosc.md
      - SCOPE: reference/modules/scope.md
      - COPY PROJECT: reference/modules/copy-project.md
      - EUCLID FILL: reference/modules/euclid-fill.md
      - PERSISTENT BUFFERS: reference/modules/persistent-buffers.md
      - RND NAME: reference/modules/rnd-name.md
markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.snippets:
      base_path: [docs/site]
